  function createTimetable() {

    const grid = document.getElementById("timetableGrid");

    grid.innerHTML = "";

    // 左上
    const empty = document.createElement("div");

    empty.className = "header";
    empty.textContent = "";

    grid.appendChild(empty);


    // 曜日
    DAYS.forEach(day => {

      const header = document.createElement("div");

      header.className = "header";
      header.textContent = day + "曜";

      grid.appendChild(header);

    });


    // 各時限
    PERIODS.forEach(period => {

      const periodCell = document.createElement("div");

      periodCell.className = "period";

      periodCell.textContent = period + "限";

      grid.appendChild(periodCell);


      DAYS.forEach(day => {

        const button = document.createElement("button");

        button.type = "button";

        button.className = "class-button";

        button.dataset.day = day;
        button.dataset.period = period;


        /*
         * マスの中には
         *
         * ・曜日
         * ・時限
         * ・通知時刻
         *
         * を表示しない。
         *
         * 選択時のみ「✓」を表示する。
         */

        button.innerHTML =
          `<span class="check"></span>`;


        button.addEventListener("click", function() {

          toggleClass(day, period);

        });


        grid.appendChild(button);

      });

    });

  }


  /**************************************************

  function getClassKey(day, period) {

    return day + "_" + period;

  }


  function toggleClass(day, period) {

    const key = getClassKey(day, period);

    if (selectedClasses.has(key)) {

      selectedClasses.delete(key);

    } else {

      selectedClasses.add(key);

    }

    updateButtons();

  }


  /**************************************************
   * ボタン表示更新
   **************************************************/

  function updateButtons() {

    document.querySelectorAll(".class-button").forEach(button => {

      const day = button.dataset.day;
      const period = button.dataset.period;

      const key = getClassKey(day, period);

      const check = button.querySelector(".check");

      if (selectedClasses.has(key)) {

        button.classList.add("selected");

        check.textContent = "✓";

      } else {

        button.classList.remove("selected");

        check.textContent = "";

      }

    });

  }


  /**************************************************

  function callGasApi(params) {

    return new Promise((resolve, reject) => {

      const callbackName =
        "gasCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);


      const script = document.createElement("script");

      const query = new URLSearchParams(params);

      query.set("callback", callbackName);

      script.src = GAS_URL + "?" + query.toString();


      let finished = false;


      const timeout = setTimeout(() => {

        if (finished) return;

        finished = true;

        cleanup();

        reject(new Error("GAS APIがタイムアウトしました"));

      }, 15000);


      window[callbackName] = function(data) {

        if (finished) return;

        finished = true;

        clearTimeout(timeout);

        cleanup();

        resolve(data);

      };


      script.onerror = function() {

        if (finished) return;

        finished = true;

        clearTimeout(timeout);

        cleanup();

        reject(new Error("GAS APIへの接続に失敗しました"));

      };


      function cleanup() {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }


      document.body.appendChild(script);

    });

  }

  }
